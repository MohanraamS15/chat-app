<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="onboarding">
        <input type="text" id="username" placeholder="enter username" value="Mohan" required>
        <input type="text" id="create-room" placeholder="room id to create" value="1" required>
        <button onclick="createRoom()">Create Room</button>

        <div id="room-message-container"></div>

        <input type="text" id="join-room" placeholder="room id to join" value="1" required>
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <div id="chat-container" style="display:none;">
        <div id="room-info-container"></div>

        <div id="messages"></div>

        <div class="message-row">
            <input type="text" id="message" placeholder="type a message...">
            <button class="send-btn" onclick="sendMessage()">Send</button>
            <button id="chat-open" style="display:none;" onclick="openChat()">Open</button>
            <button id="chat-close" style="display:none;" onclick="closeChat()">Close</button>
        </div>

        <div id="online-users-container"></div>

        <div id="warning-message-container"></div>

        <div id="highlight-container" style="display:none;">
            <h2>Highlighted</h2>
        </div>

        <div id="alert-container" style="display:none;">
            <h2>Alerted</h2>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
